{% extends 'pedidos/base.html' %}

{% block titulo %}Clientes — Pedidão{% endblock %}

{% block conteudo %}
    <h1>Clientes</h1>
    <ul>
        {% for cliente in clientes %}
            <li class="item">{{ cliente.nome }} — {{ cliente.telefone }}</li>
        {% empty %}
            <li class="item">Nenhum cliente cadastrado.</li>
        {% endfor %}
    </ul>
{% endblock %}
